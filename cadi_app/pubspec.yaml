name: cadi
description: CADi — 失智症陪伴 App（病人 & 家屬雙模式）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 路由
  go_router: ^14.2.0
  # 狀態管理
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  # 字體
  google_fonts: ^6.2.1
  # 影片播放
  video_player: ^2.9.2
  # 動畫
  flutter_animate: ^4.5.0
  # 日曆
  table_calendar: ^3.1.2
  # 本地儲存
  hive_flutter: ^1.1.0
  # 圖片選擇
  image_picker: ^1.1.2
  # 工具
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
